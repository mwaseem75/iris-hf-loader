# Offline tests (no IRIS, no network): the loader and discovery logic with SQLite and
# fakes, the UI helpers, and the import monitoring with a fake API.
name: tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow pytest
      - run: pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/ui/state.test.mjs
      - run: node tests/ui/mocked.mjs

  # The Docker image builds even from a checkout with Windows line endings (CRLF),
  # the worst case for a Windows user whose git ignores .gitattributes.
  docker-build-crlf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git ls-files -z | xargs -0 file | grep -E ':.*text' | cut -d: -f1 | xargs sed -i 's/$/\r/'
          file constraints.txt iris.script Dockerfile
      - run: docker build -t iris-hf-loader-ci .
